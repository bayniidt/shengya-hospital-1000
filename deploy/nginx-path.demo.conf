location = /shengya-demo {
    return 302 /shengya-demo/;
}

location ^~ /shengya-demo/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    sub_filter_once off;
    sub_filter_types text/css application/javascript;
    sub_filter '"/ribenpeizhen/' '"/shengya-demo/ribenpeizhen/';
    sub_filter '`/ribenpeizhen/' '`/shengya-demo/ribenpeizhen/';
    sub_filter '"/圣娅医院素材/' '"/shengya-demo/圣娅医院素材/';
    sub_filter '`/圣娅医院素材/' '`/shengya-demo/圣娅医院素材/';
    sub_filter '"/sites/' '"/shengya-demo/sites/';
    sub_filter 'url(&#x27;/ribenpeizhen/' 'url(&#x27;/shengya-demo/ribenpeizhen/';
}
