<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣娅 · 内容后台</title><style>body{margin:0;background:#f8f5f1;color:#493a34;font:14px system-ui,"PingFang SC",sans-serif}main{max-width:1100px;margin:45px auto;padding:0 20px}h1,h2{font-weight:500}section{background:#fff;padding:24px;margin:22px 0;box-shadow:0 12px 35px #493a3412}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}th{color:#977152;font-weight:500}.unread{color:#b06d38}.read{color:#777}button{border:0;background:#493a34;color:#fff;padding:9px 14px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{display:flex;flex-direction:column;gap:7px;color:#77695f}.fields input{padding:10px;border:1px solid #ddd5ce}.wide{grid-column:1/-1}@media(max-width:700px){.fields{grid-template-columns:1fr}}</style><main><h1>圣娅医院内容后台</h1><section><h2>网站文案与媒体</h2><p id="contentStatus">加载中…</p><form id="contentForm" class="fields"></form><button onclick="saveContent()">保存并发布</button></section><section><h2>咨询提交记录</h2><p id="summary">加载中…</p><table><thead><tr><th>时间</th><th>称呼</th><th>电话</th><th>咨询内容</th><th>状态</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const token=prompt('请输入管理员 Token（未设置可直接取消）')||'';const headers=token?{'x-admin-token':token}:{};const labels={siteName:'医院名称',tagline:'品牌主张',phone:'联系电话',email:'邮箱',address:'地址',hours:'营业时间',heroImage:'首屏图片 URL',heroVideo:'首屏视频 URL'};async function loadContent(){const data=await fetch('/api/content').then(r=>r.json());contentForm.innerHTML=Object.entries(labels).map(([key,label])=>`<label class="${key==='tagline'||key==='address'?'wide':''}">${label}<input name="${key}" value="${esc(data[key]||'')}"></label>`).join('');contentStatus.textContent='修改后点击保存并发布，前端读取 /api/content。'}async function saveContent(){const body=Object.fromEntries(new FormData(contentForm));const r=await fetch('/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)});contentStatus.textContent=r.ok?'保存成功':'保存失败，请检查管理员 Token'}async function load(){const data=await fetch('/api/admin/contact-submissions',{headers}).then(r=>r.json());if(!Array.isArray(data)){summary.textContent=data.error||'加载失败';return}summary.textContent=`共 ${data.length} 条记录`;rows.innerHTML=data.map(x=>`<tr><td>${x.created_at}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.message)}</td><td class="${x.status}">${x.status==='read'?'已读':'未读'}</td><td>${x.status==='unread'?`<button onclick="read(${x.id})">标记已读</button>`:''}</td></tr>`).join('')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function read(id){await fetch('/api/admin/contact-submissions/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify({status:'read'})});load()}loadContent();load()</script>
